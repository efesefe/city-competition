# Local Postgres + Redis for the Fastify slice.
# Prod: DATABASE_URL (Neon / Fly MPG) + REDIS_URL (Upstash rediss:// or equivalent EU Redis).
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: city
      POSTGRES_PASSWORD: city
      POSTGRES_DB: city_competition
    volumes:
      - city_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city -d city_competition"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  city_pg_data:
