# Local Postgres for the Fastify slice (Neon / Fly MPG in prod via DATABASE_URL).
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: city
      POSTGRES_PASSWORD: city
      POSTGRES_DB: city_competition
    volumes:
      - city_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city -d city_competition"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  city_pg_data:
