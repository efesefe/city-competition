services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citycomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citycomp}
      POSTGRES_DB: ${POSTGRES_DB:-citycomp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citycomp} -d ${POSTGRES_DB:-citycomp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${PAYMENTS_HTTP_ADDR:-:8081}
      PAYMENTS_DATABASE_URL: ${PAYMENTS_DATABASE_URL:-postgres://citycomp:citycomp@postgres:5432/citycomp_payments?sslmode=disable}
      PAYMENTS_INTERNAL_TOKEN: ${PAYMENTS_INTERNAL_TOKEN:-dev-payments-internal-token}
      MAIN_API_URL: ${MAIN_API_URL:-http://backend:8080}
      PAYMENTS_WEBHOOK_PUBLIC_BASE: ${PAYMENTS_WEBHOOK_PUBLIC_BASE:-http://payments:8081}
      DB_MAX_CONNS: ${PAYMENTS_DB_MAX_CONNS:-5}
      DB_MIN_CONNS: ${PAYMENTS_DB_MIN_CONNS:-1}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-30m}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      PAPARA_API_KEY: ${PAPARA_API_KEY:-}
      PAPARA_SECRET_KEY: ${PAPARA_SECRET_KEY:-}
      PAPARA_BASE_URL: ${PAPARA_BASE_URL:-https://merchant-api.test.papara.com}
      BKM_API_KEY: ${BKM_API_KEY:-}
      BKM_SECRET_KEY: ${BKM_SECRET_KEY:-}
      BKM_BASE_URL: ${BKM_BASE_URL:-https://sandbox-api.bkmexpress.com.tr}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://citycomp:citycomp@postgres:5432/citycomp?sslmode=disable}
      PAYMENTS_DATABASE_URL: ${PAYMENTS_DATABASE_URL:-postgres://citycomp:citycomp@postgres:5432/citycomp_payments?sslmode=disable}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-30m}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PAYMENTS_SERVICE_URL: ${PAYMENTS_SERVICE_URL:-http://payments:8081}
      PAYMENTS_INTERNAL_TOKEN: ${PAYMENTS_INTERNAL_TOKEN:-dev-payments-internal-token}
      PAYMENTS_DEFAULT_RETURN_URL: ${PAYMENTS_DEFAULT_RETURN_URL:-http://localhost:3000/credits}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payments:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./docker/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./docker/observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - payments

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  loki_data:
  prometheus_data:
  grafana_data:
