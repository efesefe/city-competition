global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: api
  - job_name: payments
    static_configs:
      - targets: ["payments:8081"]
        labels:
          service: payments

alerting:
  alertmanagers: []
